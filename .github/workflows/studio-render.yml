name: Render presentation videos

# Renders the Remotion commercial (remotion/Commercial.tsx) for every locale from the
# committed narration and score in public/studio and commits the MP4s back.
# Runs on Linux so the Remotion compositor/ffmpeg binaries can execute.
on:
  workflow_dispatch:
    inputs:
      locales:
        description: "Locales to render (space-separated, empty = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "public/studio/**/*.mp3"
      - "remotion/**"
      - "scripts/studio/render.ts"
      - "scripts/studio/build-script.ts"
      - "src/lib/commercial.ts"

permissions:
  contents: write

concurrency:
  group: studio-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Browser dependencies
        run: npx remotion browser ensure

      - name: Narration script
        run: npm run studio:script

      - name: Render
        run: npx tsx scripts/studio/render.ts ${{ github.event.inputs.locales }}

      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(studio): render presentation videos [skip ci]"
          git push
